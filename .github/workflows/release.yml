name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: uv run pytest -q
      - run: uv run python -m sg_gtfs.build

      - name: MobilityData gtfs-validator (zero errors)
        run: |
          curl -fsSL -o gtfs-validator.jar \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          java -jar gtfs-validator.jar -i dist/singapore-gtfs.zip -o validator-report
          test "$(jq '[.notices[] | select(.severity == "ERROR")] | length' validator-report/report.json)" -eq 0

      - name: Create release with feed asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feed_version=$(unzip -p dist/singapore-gtfs.zip feed_info.txt | tail -1 | cut -d, -f4 | tr -d '\r')
          sha256=$(sha256sum dist/singapore-gtfs.zip | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" dist/singapore-gtfs.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "feed_version: ${feed_version} — zip sha256: ${sha256}"
