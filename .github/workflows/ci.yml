name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m sg_gtfs.build

      - name: MobilityData gtfs-validator (zero errors)
        run: |
          curl -fsSL -o gtfs-validator.jar \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          java -jar gtfs-validator.jar -i dist/singapore-gtfs.zip -o validator-report
          errors=$(jq '[.notices[] | select(.severity == "ERROR")] | length' validator-report/report.json)
          echo "validator errors: $errors (warnings are acceptable — see the README's Validation section)"
          test "$errors" -eq 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtfs-and-validator-report
          path: |
            dist/singapore-gtfs.zip
            validator-report/
