[project]
name = "singapore-gtfs"
version = "0.1.0"
description = "Unofficial Singapore rail + bus GTFS feed, built from primary-source data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# The geo stack is pinned exactly: coordinate formatting in stops.txt depends
# on it, and tests/test_output_manifest.py asserts byte-identical output.
# Relax the pins only together with a deliberate manifest regeneration.
dependencies = [
    "geopandas==1.1.4",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "pandas==3.0.3",
    "numpy==2.5.1",
]

[project.scripts]
build-gtfs = "sg_gtfs.build:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
extract = ["requests>=2.32", "openpyxl>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_gtfs"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
